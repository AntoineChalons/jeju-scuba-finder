# CI gate for the Cloudflare Pages deployment of divingjeju.com.
# Publishing is done by Cloudflare Pages, which builds `main` through its
# own Git integration (same pattern as AntoineChalons/matcast for
# capartencoree.com). This workflow only verifies that the branch builds.
# It runs on pull requests against main and on every push to main, so the
# branch Cloudflare publishes from is always guaranteed clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (JS)
        run: npm test

      - name: Build
        run: npm run build
