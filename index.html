<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Jeju Dive Club Comparator</title>
<script type="module" src="/src/main.js"></script>
<style>
:root{
  --bg:#0b1e2d;
  --surface:#0f2937;
  --surface-2:#123a4d;
  --border:#234;
  --text:#eaf3f7;
  --text-muted:#9db6c2;
  --accent:#4fd1c5;
  --accent-hover:#38b2a4;
  --danger:#e05c5c;
}
*{box-sizing:border-box;}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:20px;
}
h1{color:var(--accent);font-size:22px;margin-bottom:4px;}
.subtitle{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}
.page-header .titles{min-width:0;}
#language-switcher{
  position:relative;
  flex-shrink:0;
}
#language-switcher-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 10px;
  font-size:13px;
  cursor:pointer;
}
#language-switcher-toggle:hover{background:#175373;}
#language-switcher-toggle svg{border-radius:2px;display:block;}
#language-switcher-toggle .lang-code{white-space:nowrap;}
#language-switcher-menu{
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  margin:0;
  padding:6px;
  list-style:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  min-width:150px;
  z-index:1000;
}
#language-switcher-menu[hidden]{display:none;}
.lang-option{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  background:transparent;
  color:var(--text);
  border:none;
  border-radius:6px;
  padding:7px 8px;
  font-size:13px;
  text-align:left;
  cursor:pointer;
}
.lang-option:hover{background:#175373;}
.lang-option[aria-current="true"]{background:var(--surface-2);color:var(--accent);}
.lang-option svg{border-radius:2px;flex-shrink:0;}
#status{margin-bottom:12px;color:#9fb;font-size:13px;}
.layout{
  display:grid;
  grid-template-columns: 1fr;
  gap:16px;
}
@media (min-width: 900px){
  .layout{grid-template-columns: 1.4fr 1fr;}
}
#map{
  width:100%;
  height:420px;
  border-radius:8px;
  border:1px solid var(--border);
}
.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:8px;
}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;white-space:nowrap;}
th{background:var(--surface-2);cursor:pointer;user-select:none;position:sticky;top:0;}
th:hover{background:#175373;}
tr:nth-child(even){background:var(--surface);}
tr:hover{background:#1b4b63;cursor:pointer;}
tr.selected-row{background:#204a5c !important;}
.badge-true{color:var(--accent);font-weight:600;}
.badge-false{color:var(--danger);}
.arrow{font-size:11px;margin-left:4px;opacity:.7;}
a{color:#7fd8f5;}
.footer-links{
  margin-top:16px;
  font-size:13px;
  color:var(--text-muted);
}
.footer-links a{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid transparent;
}
.footer-links a:hover{
  border-bottom-color:var(--accent);
}
.maplibregl-popup-content{
  background:#0f2937 !important;
  color:var(--text) !important;
  border-radius:6px;
  padding:10px 12px;
}
.maplibregl-popup-tip{border-top-color:#0f2937 !important;border-bottom-color:#0f2937 !important;}
.maplibregl-popup-close-button{color:var(--text-muted) !important;font-size:16px !important;padding:2px 6px !important;}
.maplibregl-ctrl-attrib a{color:var(--accent);}
.popup-title{font-weight:700;color:var(--accent);margin-bottom:4px;}
.popup-title-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  text-decoration:none;
  border-bottom:1px solid transparent;
}
.popup-title-link:hover{border-bottom-color:var(--accent);}
.popup-title-link::after{
  content:'↗';
  font-size:11px;
  opacity:0.75;
}
.popup-row{font-size:12px;color:var(--text-muted);margin:2px 0;}
.filter-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:end;
  gap:12px;
  margin-bottom:16px;
  padding:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
}
.filter-field{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.filter-field label{
  font-size:11px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.03em;
}
.filter-field select,
.filter-field input{
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 8px;
  font-size:13px;
  min-width:150px;
}
.filter-field input{min-width:120px;}
.filter-field select:focus,
.filter-field input:focus{outline:1px solid var(--accent);}
#filter-reset{
  background:var(--surface-2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:6px;
  padding:7px 12px;
  font-size:13px;
  cursor:pointer;
}
#filter-reset:hover:not(:disabled){background:#175373;}
#filter-reset:disabled{opacity:.5;cursor:default;}
#filter-summary{
  font-size:12px;
  color:var(--text-muted);
  margin-left:auto;
  align-self:center;
}
.filter-checks{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding-bottom:6px;
}
.filter-check{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  user-select:none;
}
.filter-check input[type="checkbox"]{
  width:16px;
  height:16px;
  min-width:0;
  margin:0;
  cursor:pointer;
  accent-color:var(--accent);
}

/* ---------- Club detail drawer (issue #2) ---------- */
/* Desktop: a non-modal side panel docked to the right edge.
   Narrow viewports (<900px, matching the .layout breakpoint): a modal
   bottom sheet with a backdrop. */
.club-drawer{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  width:min(380px, 92vw);
  background:var(--surface);
  border-left:1px solid var(--border);
  box-shadow:-8px 0 28px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
  z-index:1100;
  overflow:hidden;
}
.club-drawer[hidden]{display:none;}
.drawer-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  background:var(--surface-2);
  flex-shrink:0;
}
.drawer-header h2{
  margin:0;
  font-size:17px;
  line-height:1.3;
  color:var(--accent);
  /* Long club names must wrap rather than overflow the fixed-width panel. */
  overflow-wrap:anywhere;
}
.drawer-close{
  background:transparent;
  color:var(--text-muted);
  border:1px solid var(--border);
  border-radius:6px;
  font-size:18px;
  line-height:1;
  padding:4px 9px;
  cursor:pointer;
  flex-shrink:0;
}
.drawer-close:hover{background:#175373;color:var(--text);}
.drawer-close:focus-visible,
.club-drawer a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.drawer-body{
  padding:4px 16px 20px;
  overflow-y:auto;
  flex:1;
}
.drawer-section{margin-top:16px;}
.drawer-section h3{
  margin:0 0 8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-muted);
}
.drawer-list{margin:0;}
.drawer-row{
  display:grid;
  grid-template-columns:minmax(0,110px) minmax(0,1fr);
  gap:10px;
  padding:5px 0;
  border-bottom:1px solid rgba(35,68,68,.5);
  font-size:13px;
}
.drawer-row dt{color:var(--text-muted);overflow-wrap:anywhere;}
.drawer-row dd{margin:0;overflow-wrap:anywhere;}
.drawer-empty{
  margin:0;
  font-size:13px;
  color:var(--text-muted);
  font-style:italic;
}
.contact-list{list-style:none;margin:0;padding:0;}
.contact-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid rgba(35,68,68,.5);
}
.contact-icon{
  flex-shrink:0;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  font-size:14px;
}
.contact-body{display:flex;flex-direction:column;min-width:0;}
.contact-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--text-muted);
}
.contact-value{font-size:13px;overflow-wrap:anywhere;}
.drawer-backdrop{display:none;}
@media (max-width: 899px){
  .club-drawer{
    top:auto;
    left:0;
    right:0;
    width:auto;
    max-height:82vh;
    border-left:none;
    border-top:1px solid var(--border);
    border-radius:12px 12px 0 0;
    box-shadow:0 -8px 28px rgba(0,0,0,.5);
  }
  body.drawer-open .drawer-backdrop{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:1050;
  }
  /* Stop the page scrolling behind the sheet. */
  body.drawer-open{overflow:hidden;}
}
</style>
</head>
<body>
<div class="page-header">
  <div class="titles">
    <h1 id="page-title">Jeju Dive Club Comparator</h1>
    <div id="page-subtitle" class="subtitle">Compare scuba diving clubs on Jeju Island. Click a column header to sort, click a row to highlight it on the map.</div>
  </div>
  <div id="language-switcher"></div>
</div>
<div id="status">Loading database...</div>

<div class="filter-bar">
  <div class="filter-field">
    <label for="filter-certification">Certification</label>
    <select id="filter-certification"><option value="all">All certifications</option></select>
  </div>
  <div class="filter-field">
    <label for="filter-size">Size</label>
    <select id="filter-size"><option value="all">All sizes</option></select>
  </div>
  <div class="filter-field">
    <label for="filter-language">Language</label>
    <select id="filter-language"><option value="all">All languages</option></select>
  </div>
  <div class="filter-field">
    <label for="filter-max-price">Max price/dive (KRW)</label>
    <input type="number" id="filter-max-price" min="0" step="1000" placeholder="No limit">
  </div>
  <div class="filter-checks" role="group" aria-label="Capabilities">
    <label class="filter-check"><input type="checkbox" id="filter-owns-boat"><span>Owns a boat</span></label>
    <label class="filter-check"><input type="checkbox" id="filter-tec-diving"><span>Tec diving</span></label>
    <label class="filter-check"><input type="checkbox" id="filter-freediving"><span>Freediving</span></label>
  </div>
  <button id="filter-reset" type="button" disabled>Reset filters</button>
  <span id="filter-summary"></span>
</div>

<div class="layout">
  <div id="map"></div>
  <div class="table-wrap">
    <table id="clubTable">
      <thead>
      <tr>
        <th data-key="name">Name</th>
        <th data-key="size">Size</th>
        <th data-key="years_of_existence">Years</th>
        <th data-key="certifications">Certs</th>
        <th data-key="owns_boat">Boat</th>
        <th data-key="tec_diving">Tec</th>
        <th data-key="freediving">Free</th>
        <th data-key="estimated_price_per_dive_krw">Price/dive (KRW)</th>
        <th data-key="website_url">Website</th>
        <th data-key="naver_map_url">Naver Map</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="club-drawer" class="club-drawer" role="dialog" aria-labelledby="drawer-title" hidden>
  <header class="drawer-header">
    <h2 id="drawer-title"></h2>
    <button id="drawer-close" type="button" class="drawer-close" data-drawer-close aria-label="Close details">&times;</button>
  </header>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div class="footer-links">
  <span id="footer-prompt">Spotted an error or missing club?</span> <a id="footer-link" href="https://github.com/antoinechalons/jeju-scuba-finder/issues/new" target="_blank" rel="noopener noreferrer">Suggest edits on GitHub</a>
</div>
</body>
</html>
